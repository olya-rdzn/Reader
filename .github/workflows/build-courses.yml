name: Build courses.json
on:
  push:
    branches: [main, master]
    paths:
      - 'data/**'
      - '!data/courses.json'
      - 'scripts/build-courses.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-courses
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild courses.json
        run: python3 scripts/build-courses.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/courses.json
          git diff --cached --quiet || (git commit -m "Update courses.json" && git push)
